<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MLS IPTV</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        /* === TÍTULO CON ESPACIO REDUCIDO === */
        .header {
            text-align: center;
            padding: 10px 0 12px;
        }
        
        .header h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        /* === FIN TÍTULO CON ESPACIO REDUCIDO === */
        
        .player-float {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 380px;
            max-width: 90vw;
            background: rgba(0, 0, 0, 0.95);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            z-index: 1000;
            display: none;
            border: 2px solid rgba(102, 126, 234, 0.3);
            backdrop-filter: blur(20px);
            animation: floatIn 0.4s ease;
        }
        
        @keyframes floatIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        .player-float.active {
            display: block;
        }
        
        .player-float video {
            width: 100%;
            max-height: 250px;
            background: #000;
            display: block;
        }
        
        .player-float .player-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.9);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .player-float .channel-name-display {
            font-weight: 600;
            font-size: 0.9rem;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-right: 10px;
        }
        
        .player-float .player-controls-buttons {
            display: flex;
            gap: 8px;
        }
        
        .player-float .btn-control {
            background: rgba(255,255,255,0.05);
            border: none;
            color: #fff;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s;
        }
        
        .player-float .btn-control:hover {
            background: rgba(255,255,255,0.15);
        }
        
        .player-float .btn-control.pip:hover {
            background: rgba(102, 126, 234, 0.3);
            color: #667eea;
        }
        
        .player-float .btn-control.close:hover {
            background: rgba(245, 87, 108, 0.3);
            color: #f5576c;
        }
        
        .player-float .player-status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 1rem;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            border-radius: 10px;
            pointer-events: none;
            display: none;
            text-align: center;
        }
        
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.05);
            padding: 12px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        
        .controls input[type="text"] {
            flex: 1;
            min-width: 120px;
            padding: 12px 14px;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 0.95rem;
            transition: all 0.3s;
        }
        
        .controls input[type="text"]:focus {
            border-color: #667eea;
            outline: none;
            background: rgba(255,255,255,0.08);
        }
        
        .controls input[type="file"] {
            display: none;
        }
        
        .controls input[type="number"] {
            width: 60px;
            padding: 10px 4px;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 0.95rem;
            text-align: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }
        
        .controls input[type="number"]:focus {
            border-color: #667eea;
            outline: none;
            background: rgba(255,255,255,0.08);
        }
        
        .controls input[type="number"]::-webkit-inner-spin-button {
            opacity: 1;
        }
        
        .btn {
            padding: 12px 14px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex: 0 1 calc(50% - 8px);
            justify-content: center;
            min-width: 70px;
            max-width: calc(50% - 8px);
            height: 46px;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #00b09b 0%, #96c93d 100%);
            color: #fff;
        }
        
        .btn-success:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 176, 155, 0.4);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: #fff;
        }
        
        .btn-danger:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(245, 87, 108, 0.4);
        }
        
        .btn-warning {
            background: linear-gradient(135deg, #f2994a 0%, #f2c94a 100%);
            color: #fff;
        }
        
        .btn-warning:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(242, 153, 74, 0.4);
        }
        
        .btn-info {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: #fff;
        }
        
        .btn-info:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(79, 172, 254, 0.4);
        }
        
        .btn-verify {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: #fff;
        }
        
        .btn-verify:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(245, 87, 108, 0.4);
        }
        
        .btn-verify.verifying {
            background: linear-gradient(135deg, #f2994a 0%, #f2c94a 100%);
            animation: pulse 1s infinite;
        }
        
        .btn-reset-verify {
            background: linear-gradient(135deg, #a8a8a8 0%, #6c6c6c 100%);
            color: #fff;
            flex: 0 0 auto;
            min-width: 44px;
            max-width: 44px;
            padding: 12px 8px;
            font-size: 1rem;
        }
        
        .btn-reset-verify:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(108, 108, 108, 0.4);
        }
        
        .btn-select-all {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: #fff;
        }
        
        .btn-select-all:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(79, 172, 254, 0.4);
        }
        
        .btn-deselect-all {
            background: linear-gradient(135deg, #a8a8a8 0%, #6c6c6c 100%);
            color: #fff;
        }
        
        .btn-deselect-all:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(108, 108, 108, 0.4);
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        
        .verify-group {
            display: flex;
            gap: 6px;
            flex: 0 1 calc(50% - 8px);
            max-width: calc(50% - 8px);
            align-items: center;
        }
        
        .verify-group .btn {
            flex: 1;
            max-width: none;
            min-width: 50px;
        }
        
        .verify-group label {
            font-size: 0.85rem;
            opacity: 0.7;
            white-space: nowrap;
        }
        
        .selection-group {
            display: flex;
            gap: 6px;
            flex: 0 1 calc(50% - 8px);
            max-width: calc(50% - 8px);
            align-items: center;
        }
        
        .selection-group .btn {
            flex: 1;
            max-width: none;
            min-width: 50px;
        }
        
        .generate-group {
            display: flex;
            gap: 6px;
            flex: 0 1 calc(50% - 8px);
            max-width: calc(50% - 8px);
            align-items: center;
        }
        
        .generate-group .btn {
            flex: 1;
            max-width: none;
            min-width: 50px;
        }
        
        .stats {
            display: flex;
            gap: 12px;
            padding: 10px 0;
            font-size: 0.95rem;
            opacity: 0.85;
            flex-wrap: wrap;
        }
        
        .stats span {
            background: rgba(255,255,255,0.05);
            padding: 5px 12px;
            border-radius: 20px;
        }
        
        .stats .working {
            color: #38ef7d;
        }
        
        .stats .not-working {
            color: #f5576c;
        }
        
        .channel-list {
            margin: 15px 0;
            padding-bottom: 100px;
        }
        
        .channel-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            margin-bottom: 6px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            transition: all 0.3s;
            animation: slideIn 0.3s ease;
            cursor: pointer;
        }
        
        .channel-item:hover {
            background: rgba(255,255,255,0.12);
            transform: translateX(5px);
        }
        
        .channel-item.verified-working {
            border-left: 4px solid #38ef7d;
            background: rgba(56, 239, 125, 0.05);
        }
        
        .channel-item.verified-failed {
            border-left: 4px solid #f5576c;
            background: rgba(245, 87, 108, 0.05);
            opacity: 0.6;
        }
        
        .channel-item.verifying {
            border-left: 4px solid #f2994a;
            background: rgba(242, 153, 74, 0.05);
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        /* === CHECKBOX MÁS GRANDE === */
        .channel-item input[type="checkbox"] {
            width: 22px;
            height: 22px;
            accent-color: #667eea;
            cursor: pointer;
            flex-shrink: 0;
        }
        /* === FIN CHECKBOX MÁS GRANDE === */
        
        .channel-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        
        /* === LETRA DE CANALES MÁS GRANDE === */
        .channel-name {
            font-weight: 600;
            font-size: 1.2rem;
        }
        
        .channel-link {
            font-size: 0.9rem;
            opacity: 0.5;
            word-break: break-all;
        }
        
        .channel-status {
            font-size: 0.85rem;
            margin-top: 2px;
        }
        /* === FIN LETRA DE CANALES MÁS GRANDE === */
        
        .channel-status .status-working {
            color: #38ef7d;
        }
        
        .channel-status .status-failed {
            color: #f5576c;
        }
        
        .channel-status .status-checking {
            color: #f2994a;
        }
        
        .channel-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        
        /* === ICONOS DE CANALES MÁS GRANDES === */
        .btn-icon {
            background: rgba(255,255,255,0.05);
            color: #fff;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
        }
        
        .btn-icon i {
            font-size: 1rem;
        }
        /* === FIN ICONOS DE CANALES MÁS GRANDES === */
        
        .btn-icon:hover {
            background: rgba(255,255,255,0.1);
        }
        
        .btn-icon.danger:hover {
            background: rgba(245, 87, 108, 0.3);
            color: #f5576c;
        }
        
        .btn-icon.play:hover {
            background: rgba(56, 239, 125, 0.2);
            color: #38ef7d;
        }
        
        .btn-icon.check:hover {
            background: rgba(79, 172, 254, 0.2);
            color: #4facfe;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            opacity: 0.5;
        }
        
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 15px;
        }
        
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            padding: 14px 24px;
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
            z-index: 2000;
            display: none;
            animation: toastIn 0.3s ease;
            max-width: 90%;
            text-align: center;
        }
        
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        
        .toast.show {
            display: block;
        }
        
        .channel-item.playing {
            border-left: 4px solid #38ef7d;
            background: rgba(56, 239, 125, 0.05);
        }
        
        /* === BADGE REPRODUCIENDO MÁS GRANDE === */
        .badge-playing {
            background: rgba(56, 239, 125, 0.2);
            color: #38ef7d;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        /* === FIN BADGE REPRODUCIENDO MÁS GRANDE === */
        
        .import-info {
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 14px;
            border-radius: 8px;
            margin: 8px 0;
            font-size: 0.9rem;
            opacity: 0.7;
            display: none;
        }
        
        .import-info.show {
            display: block;
        }
        
        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin: 8px 0;
            overflow: hidden;
            display: none;
        }
        
        .progress-bar.active {
            display: block;
        }
        
        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border-radius: 2px;
            transition: width 0.3s;
            width: 0%;
        }
        
        .url-input-group {
            display: flex;
            gap: 8px;
            width: 100%;
        }
        
        .url-input-group input {
            flex: 1;
        }
        
        .url-input-group .btn {
            flex: 0 1 auto;
            max-width: none;
        }
        
        @media (max-width: 600px) {
            .controls {
                flex-direction: column;
            }
            
            .controls input[type="text"] {
                width: 100%;
            }
            
            .btn {
                flex: 1 1 100%;
                max-width: 100%;
            }
            
            .verify-group {
                flex: 1 1 100%;
                max-width: 100%;
            }
            
            .verify-group .btn {
                flex: 1;
            }
            
            .selection-group {
                flex: 1 1 100%;
                max-width: 100%;
            }
            
            .selection-group .btn {
                flex: 1;
            }
            
            .generate-group {
                flex: 1 1 100%;
                max-width: 100%;
            }
            
            .generate-group .btn {
                flex: 1;
            }
            
            .channel-item {
                flex-wrap: wrap;
            }
            
            .channel-actions {
                width: 100%;
                justify-content: flex-end;
                margin-top: 6px;
            }
            
            .header h1 {
                font-size: 1.7rem;
            }
            
            .player-float {
                width: 95vw;
                bottom: 10px;
                right: 2.5vw;
            }
            
            .player-float video {
                max-height: 180px;
            }
            
            .url-input-group {
                flex-direction: column;
            }
            
            .url-input-group .btn {
                flex: 1;
                max-width: 100%;
            }
            
            .btn-reset-verify {
                min-width: 40px;
                max-width: 40px;
                padding: 12px 6px;
            }
        }
        
        @media (min-width: 601px) {
            .btn {
                flex: 0 1 calc(50% - 8px);
                max-width: calc(50% - 8px);
            }
            
            .verify-group {
                flex: 0 1 calc(50% - 8px);
                max-width: calc(50% - 8px);
            }
            
            .selection-group {
                flex: 0 1 calc(50% - 8px);
                max-width: calc(50% - 8px);
            }
            
            .generate-group {
                flex: 0 1 calc(50% - 8px);
                max-width: calc(50% - 8px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>MLS IPTV</h1>
        </div>
        
        <!-- Reproductor flotante -->
        <div class="player-float" id="playerFloat">
            <div class="player-header">
                <span class="channel-name-display" id="currentChannelName">Canal</span>
                <div class="player-controls-buttons">
                    <button class="btn-control pip" onclick="togglePiP()" title="Picture-in-Picture">
                        <i class="fas fa-expand"></i>
                    </button>
                    <button class="btn-control close" onclick="closePlayer()" title="Cerrar">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
            <video id="videoPlayer" controls autoplay></video>
            <div class="player-status" id="playerStatus">
                <i class="fas fa-spinner fa-spin"></i><br>
                Cargando...
            </div>
        </div>
        
        <div class="stats">
            <span>📡 Total: <span id="totalChannels">0</span></span>
            <span>✅ Sel.: <span id="selectedChannels">0</span></span>
            <span>🟢 OK: <span id="workingChannels">0</span></span>
            <span>🔴 Fail: <span id="failedChannels">0</span></span>
            <span>▶️ <span id="playingStatus">Sin reprod.</span></span>
        </div>
        
        <div class="progress-bar" id="progressBar">
            <div class="fill" id="progressFill"></div>
        </div>
        
        <div class="controls">
            <input type="text" id="channelName" placeholder="Nombre del canal..." />
            <input type="text" id="channelLink" placeholder="Link del canal..." />
            <button class="btn btn-primary" onclick="addChannel()">
                <i class="fas fa-plus"></i> Agregar
            </button>
            
            <div class="url-input-group">
                <input type="text" id="urlInput" placeholder="https://ejemplo.com/lista.m3u" />
                <button class="btn btn-info" onclick="importFromURL()">
                    <i class="fas fa-link"></i> Cargar URL
                </button>
            </div>
            
            <button class="btn btn-warning" onclick="importM3U()">
                <i class="fas fa-file-import"></i> Subir Archivo
            </button>
            <input type="file" id="fileInput" accept=".m3u,.m3u8,.txt" onchange="handleFileImport(event)" />
            
            <div class="verify-group">
                <button class="btn btn-verify" id="btnVerify" onclick="startVerification()">
                    <i class="fas fa-check-double"></i> Verificar
                </button>
                <label for="verifyTimeout">Seg:</label>
                <input type="number" id="verifyTimeout" value="5" min="2" max="30" />
                <button class="btn btn-reset-verify" onclick="resetVerification()" title="Reiniciar verificación desde el principio">
                    <i class="fas fa-undo"></i>
                </button>
            </div>
            
            <div class="selection-group">
                <button class="btn btn-select-all" onclick="selectAll()">
                    <i class="fas fa-check-double"></i> Selec. Todos
                </button>
                <button class="btn btn-deselect-all" onclick="deselectAll()">
                    <i class="fas fa-times"></i> Deselec. Todos
                </button>
            </div>
            
            <div class="generate-group">
                <button class="btn btn-success" onclick="generateM3U()">
                    <i class="fas fa-download"></i> Generar M3U
                </button>
                <button class="btn btn-danger" onclick="clearAll()">
                    <i class="fas fa-trash"></i> Eliminar Todos
                </button>
            </div>
        </div>
        
        <div class="import-info" id="importInfo">
            <i class="fas fa-info-circle"></i> Los canales importados aparecen <strong>deseleccionados</strong> por defecto. 
            Marca los que quieras incluir en tu lista M3U.
        </div>
        
        <div class="channel-list" id="channelList">
            <div class="empty-state">
                <i class="fas fa-tv"></i>
                <p>No hay canales agregados</p>
                <p style="font-size: 0.8rem; margin-top: 8px;">Agrega canales manualmente o importa un archivo M3U</p>
            </div>
        </div>
    </div>
    
    <div class="toast" id="toast"></div>
    
    <script>
        // Base de datos en localStorage
        let channels = JSON.parse(localStorage.getItem('iptvChannels')) || [];
        let currentVideoIndex = null;
        let isPiPActive = false;
        let isVerifying = false;
        let verificationCanceled = false;
        
        // Obtener timeout de verificación
        function getVerifyTimeout() {
            const input = document.getElementById('verifyTimeout');
            let value = parseInt(input.value);
            if (isNaN(value) || value < 2) value = 2;
            if (value > 30) value = 30;
            return value;
        }
        
        // Reiniciar verificación (borrar estados de verificación)
        function resetVerification() {
            if (isVerifying) {
                showToast('⚠️ Espera a que termine la verificación actual');
                return;
            }
            if (channels.length === 0) {
                showToast('⚠️ No hay canales para reiniciar');
                return;
            }
            if (confirm('¿Reiniciar todos los estados de verificación?')) {
                channels.forEach(c => {
                    c.verified = undefined;
                    c.verifying = false;
                });
                renderChannels();
                showToast('🔄 Estados de verificación reiniciados');
            }
        }
        
        // Renderizar canales
        function renderChannels() {
            const list = document.getElementById('channelList');
            const total = document.getElementById('totalChannels');
            const selected = document.getElementById('selectedChannels');
            const working = document.getElementById('workingChannels');
            const failed = document.getElementById('failedChannels');
            const importInfo = document.getElementById('importInfo');
            
            const workingCount = channels.filter(c => c.verified === true).length;
            const failedCount = channels.filter(c => c.verified === false).length;
            
            if (channels.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-tv"></i>
                        <p>No hay canales agregados</p>
                        <p style="font-size: 0.8rem; margin-top: 8px;">Agrega canales manualmente o importa un archivo M3U</p>
                    </div>
                `;
                importInfo.classList.remove('show');
            } else {
                list.innerHTML = channels.map((channel, index) => {
                    let statusClass = '';
                    let statusHtml = '';
                    
                    if (channel.verifying) {
                        statusClass = 'verifying';
                        statusHtml = '<span class="status-checking">⏳ Verificando...</span>';
                    } else if (channel.verified === true) {
                        statusClass = 'verified-working';
                        statusHtml = '<span class="status-working">✅ Funciona</span>';
                    } else if (channel.verified === false) {
                        statusClass = 'verified-failed';
                        statusHtml = '<span class="status-failed">❌ No funciona</span>';
                    }
                    
                    return `
                    <div class="channel-item ${currentVideoIndex === index ? 'playing' : ''} ${statusClass}" 
                         onclick="playChannel(${index})">
                        <input type="checkbox" ${channel.selected ? 'checked' : ''} 
                               onclick="event.stopPropagation(); toggleChannel(${index})" />
                        <div class="channel-info">
                            <span class="channel-name">
                                ${escapeHtml(channel.name)}
                                ${currentVideoIndex === index ? '<span class="badge-playing">▶ Reproduciendo</span>' : ''}
                            </span>
                            <span class="channel-link">${escapeHtml(channel.link)}</span>
                            <span class="channel-status">${statusHtml}</span>
                        </div>
                        <div class="channel-actions">
                            <button class="btn-icon play" onclick="event.stopPropagation(); playChannel(${index})">
                                <i class="fas fa-play"></i>
                            </button>
                            <button class="btn-icon check" onclick="event.stopPropagation(); verifySingleChannel(${index})">
                                <i class="fas fa-check-circle"></i>
                            </button>
                            <button class="btn-icon" onclick="event.stopPropagation(); editChannel(${index})">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn-icon danger" onclick="event.stopPropagation(); deleteChannel(${index})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `}).join('');
                
                const selectedCount = channels.filter(c => c.selected).length;
                if (channels.length > 5 && selectedCount < channels.length) {
                    importInfo.classList.add('show');
                } else {
                    importInfo.classList.remove('show');
                }
            }
            
            total.textContent = channels.length;
            selected.textContent = channels.filter(c => c.selected).length;
            working.textContent = workingCount;
            failed.textContent = failedCount;
            
            localStorage.setItem('iptvChannels', JSON.stringify(channels));
        }
        
        // Escapar HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // ============ VERIFICACIÓN DE CANALES ============
        
        // Verificar un solo canal
        function verifySingleChannel(index) {
            if (isVerifying) return;
            const channel = channels[index];
            if (!channel) return;
            
            const timeout = getVerifyTimeout();
            
            channel.verifying = true;
            channel.verified = undefined;
            renderChannels();
            
            const video = document.createElement('video');
            let timeoutId;
            let canceled = false;
            
            timeoutId = setTimeout(() => {
                if (!canceled) {
                    canceled = true;
                    channel.verified = false;
                    channel.verifying = false;
                    channel.selected = false;
                    video.pause();
                    video.src = '';
                    renderChannels();
                    showToast(`❌ ${channel.name} - Timeout (${timeout}s)`);
                }
            }, timeout * 1000);
            
            video.onloadeddata = function() {
                if (!canceled) {
                    canceled = true;
                    channel.verified = true;
                    channel.verifying = false;
                    channel.selected = true;
                    clearTimeout(timeoutId);
                    video.pause();
                    video.src = '';
                    renderChannels();
                    showToast(`✅ ${channel.name} - Funciona correctamente`);
                }
            };
            
            video.onerror = function() {
                if (!canceled) {
                    canceled = true;
                    channel.verified = false;
                    channel.verifying = false;
                    channel.selected = false;
                    clearTimeout(timeoutId);
                    video.pause();
                    video.src = '';
                    renderChannels();
                    showToast(`❌ ${channel.name} - No se puede reproducir`);
                }
            };
            
            video.src = channel.link;
            video.load();
            video.play().catch(() => {});
        }
        
        // Verificar todos los canales
        async function startVerification() {
            if (isVerifying) {
                verificationCanceled = true;
                isVerifying = false;
                document.getElementById('btnVerify').classList.remove('verifying');
                document.getElementById('btnVerify').innerHTML = '<i class="fas fa-check-double"></i> Verificar';
                showToast('⏹️ Verificación cancelada');
                
                channels.forEach(c => {
                    c.verifying = false;
                });
                renderChannels();
                return;
            }
            
            const toVerify = channels.filter(c => c.verified !== true);
            if (toVerify.length === 0) {
                showToast('✅ Todos los canales ya están verificados');
                return;
            }
            
            const timeout = getVerifyTimeout();
            
            isVerifying = true;
            verificationCanceled = false;
            
            const btn = document.getElementById('btnVerify');
            btn.classList.add('verifying');
            btn.innerHTML = '<i class="fas fa-stop"></i> Cancelar';
            
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            progressBar.classList.add('active');
            
            let verified = 0;
            let working = 0;
            let failed = 0;
            
            for (let i = 0; i < channels.length; i++) {
                if (verificationCanceled) break;
                
                const channel = channels[i];
                if (channel.verified === true) {
                    verified++;
                    continue;
                }
                
                channel.verifying = true;
                channel.verified = undefined;
                renderChannels();
                
                const result = await verifyChannel(channel, timeout);
                
                if (verificationCanceled) break;
                
                channel.verified = result;
                channel.verifying = false;
                
                if (result) {
                    channel.selected = true;
                    working++;
                } else {
                    channel.selected = false;
                    failed++;
                }
                
                verified++;
                
                const progress = (verified / channels.length) * 100;
                progressFill.style.width = progress + '%';
                renderChannels();
                
                await sleep(300);
            }
            
            isVerifying = false;
            btn.classList.remove('verifying');
            btn.innerHTML = '<i class="fas fa-check-double"></i> Verificar';
            progressBar.classList.remove('active');
            progressFill.style.width = '0%';
            
            if (!verificationCanceled) {
                showToast(`✅ Verificación completada: ${working} funcionan, ${failed} no funcionan`);
            }
            
            renderChannels();
        }
        
        // Verificar un canal individual (promesa)
        function verifyChannel(channel, timeout) {
            return new Promise((resolve) => {
                const video = document.createElement('video');
                let resolved = false;
                
                const timeoutId = setTimeout(() => {
                    if (!resolved) {
                        resolved = true;
                        video.pause();
                        video.src = '';
                        resolve(false);
                    }
                }, timeout * 1000);
                
                video.onloadeddata = function() {
                    if (!resolved) {
                        resolved = true;
                        clearTimeout(timeoutId);
                        video.pause();
                        video.src = '';
                        resolve(true);
                    }
                };
                
                video.onerror = function() {
                    if (!resolved) {
                        resolved = true;
                        clearTimeout(timeoutId);
                        video.pause();
                        video.src = '';
                        resolve(false);
                    }
                };
                
                video.onloadstart = function() {
                    video.play().catch(() => {});
                };
                
                video.src = channel.link;
                video.load();
            });
        }
        
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
        
        // ============ FIN VERIFICACIÓN ============
        
        // Procesar contenido M3U
        function processM3UContent(content) {
            const lines = content.split('\n');
            let imported = 0;
            let currentName = '';
            let currentLogo = '';
            
            for (let line of lines) {
                line = line.trim();
                
                if (line.startsWith('#EXTINF:')) {
                    const match = line.match(/,([^,]+)$/);
                    if (match) {
                        currentName = match[1].trim();
                    }
                    const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                    if (logoMatch) {
                        currentLogo = logoMatch[1];
                    }
                } else if (line.startsWith('http://') || line.startsWith('https://')) {
                    if (currentName) {
                        const exists = channels.some(c => c.link === line);
                        if (!exists) {
                            channels.push({
                                name: currentName,
                                link: line,
                                selected: false,
                                logo: currentLogo || null,
                                verified: undefined
                            });
                            imported++;
                        }
                        currentName = '';
                        currentLogo = '';
                    }
                }
            }
            
            return imported;
        }
        
        // Importar desde URL
        async function importFromURL() {
            if (isVerifying) {
                showToast('⚠️ Espera a que termine la verificación');
                return;
            }
            
            const urlInput = document.getElementById('urlInput');
            const url = urlInput.value.trim();
            
            if (!url) {
                showToast('⚠️ Ingresa una URL válida');
                urlInput.focus();
                return;
            }
            
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                showToast('⚠️ La URL debe comenzar con http:// o https://');
                urlInput.focus();
                return;
            }
            
            showToast('⏳ Descargando lista desde URL...');
            
            try {
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Accept': 'text/plain, */*'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`Error HTTP: ${response.status} ${response.statusText}`);
                }
                
                const content = await response.text();
                const imported = processM3UContent(content);
                
                if (imported > 0) {
                    renderChannels();
                    showToast(`📥 Se importaron ${imported} canales desde URL (todos deseleccionados)`);
                    document.getElementById('importInfo').classList.add('show');
                    urlInput.value = '';
                } else {
                    showToast('⚠️ No se encontraron canales válidos en la URL');
                }
            } catch (error) {
                console.error('Error al importar desde URL:', error);
                let errorMsg = error.message;
                
                if (error.message.includes('404')) {
                    errorMsg = 'Archivo no encontrado (404). Verifica la URL';
                } else if (error.message.includes('CORS')) {
                    errorMsg = 'No se puede acceder al recurso. Prueba descargando el archivo localmente';
                } else if (error.message.includes('NetworkError') || error.message.includes('Failed to fetch')) {
                    errorMsg = 'Error de red. Verifica tu conexión a internet';
                }
                
                showToast(`❌ Error: ${errorMsg}`);
            }
        }
        
        // Seleccionar todos
        function selectAll() {
            if (isVerifying) {
                showToast('⚠️ Espera a que termine la verificación');
                return;
            }
            if (channels.length === 0) {
                showToast('⚠️ No hay canales para seleccionar');
                return;
            }
            if (confirm('¿Seleccionar todos los canales?')) {
                channels.forEach(c => c.selected = true);
                renderChannels();
                showToast('✅ Todos los canales seleccionados');
            }
        }
        
        // Deseleccionar todos
        function deselectAll() {
            if (isVerifying) {
                showToast('⚠️ Espera a que termine la verificación');
                return;
            }
            if (channels.length === 0) {
                showToast('⚠️ No hay canales para deseleccionar');
                return;
            }
            if (confirm('¿Deseleccionar todos los canales?')) {
                channels.forEach(c => c.selected = false);
                renderChannels();
                showToast('🔲 Todos los canales deseleccionados');
            }
        }
        
        // Reproducir canal
        function playChannel(index) {
            if (isVerifying) {
                showToast('⏳ Verificando canales, espera un momento');
                return;
            }
            
            const channel = channels[index];
            if (!channel) return;
            
            const playerFloat = document.getElementById('playerFloat');
            const video = document.getElementById('videoPlayer');
            const status = document.getElementById('playerStatus');
            const channelNameDisplay = document.getElementById('currentChannelName');
            const playingStatus = document.getElementById('playingStatus');
            
            if (!channel.link || (!channel.link.startsWith('http://') && !channel.link.startsWith('https://'))) {
                showToast('❌ Link inválido o no soportado');
                return;
            }
            
            playerFloat.classList.add('active');
            status.style.display = 'block';
            
            video.src = channel.link;
            channelNameDisplay.textContent = `▶ ${channel.name}`;
            playingStatus.textContent = `Reproduciendo: ${channel.name}`;
            currentVideoIndex = index;
            
            renderChannels();
            
            video.onloadeddata = function() {
                status.style.display = 'none';
                showToast(`▶️ Reproduciendo: ${channel.name}`);
            };
            
            video.onerror = function() {
                status.style.display = 'none';
                showToast('❌ Error al cargar el canal. Verifica el link.');
                playingStatus.textContent = 'Error de reproducción';
            };
            
            video.onplay = function() {
                status.style.display = 'none';
            };
            
            video.play().catch(function(error) {
                status.style.display = 'none';
                showToast('⚠️ No se pudo reproducir automáticamente. Intenta manualmente.');
                console.error('Error de reproducción:', error);
            });
        }
        
        // Cerrar reproductor
        function closePlayer() {
            const playerFloat = document.getElementById('playerFloat');
            const video = document.getElementById('videoPlayer');
            const playingStatus = document.getElementById('playingStatus');
            
            if (document.pictureInPictureElement) {
                document.exitPictureInPicture().catch(() => {});
            }
            
            video.pause();
            video.src = '';
            playerFloat.classList.remove('active');
            playingStatus.textContent = 'Sin reprod.';
            currentVideoIndex = null;
            isPiPActive = false;
            renderChannels();
        }
        
        // Toggle Picture-in-Picture
        function togglePiP() {
            const video = document.getElementById('videoPlayer');
            
            if (document.pictureInPictureElement) {
                document.exitPictureInPicture();
                isPiPActive = false;
                showToast('📺 Saliendo de Picture-in-Picture');
            } else {
                if (video.src) {
                    video.requestPictureInPicture().catch(() => {
                        showToast('⚠️ PiP no disponible en este dispositivo');
                    });
                    isPiPActive = true;
                    showToast('📺 Modo Picture-in-Picture activado');
                } else {
                    showToast('⚠️ No hay video reproduciéndose');
                }
            }
        }
        
        // Agregar canal
        function addChannel() {
            if (isVerifying) {
                showToast('⚠️ Espera a que termine la verificación');
                return;
            }
            
            const nameInput = document.getElementById('channelName');
            const linkInput = document.getElementById('channelLink');
            
            const name = nameInput.value.trim();
            const link = linkInput.value.trim();
            
            if (!name || !link) {
                showToast('❌ Completa todos los campos');
                return;
            }
            
            if (!link.startsWith('http://') && !link.startsWith('https://')) {
                showToast('⚠️ El link debe comenzar con http:// o https://');
                return;
            }
            
            channels.push({ name, link, selected: true, verified: undefined });
            nameInput.value = '';
            linkInput.value = '';
            renderChannels();
            showToast('✅ Canal agregado correctamente');
            
            nameInput.focus();
        }
        
        // Toggle selección
        function toggleChannel(index) {
            if (isVerifying) {
                showToast('⚠️ Espera a que termine la verificación');
                return;
            }
            channels[index].selected = !channels[index].selected;
            renderChannels();
        }
        
        // Eliminar canal
        function deleteChannel(index) {
            if (isVerifying) {
                showToast('⚠️ Espera a que termine la verificación');
                return;
            }
            event.stopPropagation();
            if (confirm('¿Eliminar este canal?')) {
                if (currentVideoIndex === index) {
                    closePlayer();
                }
                channels.splice(index, 1);
                renderChannels();
                showToast('🗑️ Canal eliminado');
            }
        }
        
        // Editar canal
        function editChannel(index) {
            if (isVerifying) {
                showToast('⚠️ Espera a que termine la verificación');
                return;
            }
            event.stopPropagation();
            const channel = channels[index];
            const newName = prompt('Nombre del canal:', channel.name);
            if (newName !== null) {
                const newLink = prompt('Link del canal:', channel.link);
                if (newLink !== null) {
                    channels[index] = { 
                        name: newName.trim() || channel.name, 
                        link: newLink.trim() || channel.link,
                        selected: channel.selected,
                        verified: channel.verified
                    };
                    renderChannels();
                    showToast('✏️ Canal actualizado');
                }
            }
        }
        
        // Eliminar todos
        function clearAll() {
            if (isVerifying) {
                showToast('⚠️ Espera a que termine la verificación');
                return;
            }
            if (channels.length === 0) {
                showToast('⚠️ No hay canales para eliminar');
                return;
            }
            if (confirm('¿Eliminar TODOS los canales?')) {
                closePlayer();
                channels = [];
                renderChannels();
                showToast('🧹 Todos los canales eliminados');
            }
        }
        
        // Importar desde archivo local
        function importM3U() {
            if (isVerifying) {
                showToast('⚠️ Espera a que termine la verificación');
                return;
            }
            document.getElementById('fileInput').click();
        }
        
        function handleFileImport(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                const imported = processM3UContent(content);
                if (imported > 0) {
                    renderChannels();
                    showToast(`📥 Se importaron ${imported} canales desde archivo (todos deseleccionados)`);
                    document.getElementById('importInfo').classList.add('show');
                } else {
                    showToast('⚠️ No se encontraron canales válidos en el archivo');
                }
            };
            
            reader.readAsText(file);
            event.target.value = '';
        }
        
        // Generar M3U
        function generateM3U() {
            if (isVerifying) {
                showToast('⚠️ Espera a que termine la verificación');
                return;
            }
            
            const selected = channels.filter(c => c.selected);
            if (selected.length === 0) {
                showToast('⚠️ Selecciona al menos un canal para exportar');
                return;
            }
            
            const fileName = prompt('Nombre del archivo:', `lista_${new Date().toISOString().slice(0,10)}.m3u`);
            
            if (fileName === null) {
                showToast('❌ Operación cancelada');
                return;
            }
            
            let finalName = fileName.trim();
            if (!finalName) {
                finalName = `lista_${new Date().toISOString().slice(0,10)}.m3u`;
            }
            
            if (!finalName.toLowerCase().endsWith('.m3u')) {
                finalName += '.m3u';
            }
            
            let m3uContent = '#EXTM3U\n';
            selected.forEach(channel => {
                let extinf = `#EXTINF:-1`;
                if (channel.logo) {
                    extinf += ` tvg-logo="${channel.logo}"`;
                }
                extinf += `,${channel.name}\n`;
                m3uContent += extinf;
                m3uContent += `${channel.link}\n`;
            });
            
            const blob = new Blob([m3uContent], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = finalName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showToast(`📥 Archivo guardado como: ${finalName} (${selected.length} canales)`);
        }
        
        // Toast notifications
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toast.timeout);
            toast.timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }
        
        // Enter key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                if (document.getElementById('channelName') === document.activeElement ||
                    document.getElementById('channelLink') === document.activeElement) {
                    addChannel();
                }
                if (document.getElementById('urlInput') === document.activeElement) {
                    importFromURL();
                }
            }
            
            if (e.key === 'Escape') {
                closePlayer();
            }
        });
        
        // Detectar cuando PiP se cierra manualmente
        document.addEventListener('leavepictureinpicture', function() {
            isPiPActive = false;
            showToast('📺 Saliendo de Picture-in-Picture');
        });
        
        // Inicializar
        renderChannels();
    </script>
</body>
</html>
